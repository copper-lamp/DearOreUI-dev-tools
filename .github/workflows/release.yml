name: win64 Release

# 手动发布：输入 tag 与发布说明，构建并上传 Windows x64 安装包（NSIS/MSI）到 GitHub Release。
# 默认仅触发 workflow_dispatch，绝不因 push/PR 误触发。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发布的 tag（如 v0.2.0）。将绑定并创建/更新对应 GitHub Release。'
        required: true
      release_notes:
        description: '发布说明正文'
        required: false
        default: '修复了已知漏洞'

permissions:
  contents: write

jobs:
  release-win64:
    runs-on: windows-latest
    concurrency:
      group: release-win64-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # ----- 工具链：Node（npm）+ Rust（用于 Tauri 打包） -----
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # beforeBuildCommand 由 tauri.conf.json 提供（npm run build），此处只触发打包
      - name: Build win64 installers
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release
          # 指定 triple 构建时产物位于 target/<triple>/release/bundle/，故用 find 兜底定位
          find src-tauri/target -path '*/bundle/nsis/*.exe' -type f -exec cp {} release/ \; 2>/dev/null || true
          find src-tauri/target -path '*/bundle/msi/*.msi' -type f -exec cp {} release/ \; 2>/dev/null || true
          ls -la release/ || exit 1
          count=$(find release -type f \( -name '*.exe' -o -name '*.msi' \) | wc -l)
          echo "installer count: $count"
          test "$count" -gt 0 || { echo "no installer produced"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: ORE-dev-tools-win64
          path: release/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.release_tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.release_tag }}" release/* --clobber
          else
            gh release create "${{ inputs.release_tag }}" release/* \
              --title "${{ inputs.release_tag }}" \
              --notes "${{ inputs.release_notes }}"
          fi